<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LUMIÈRE Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="login-page">
  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark">✦</span>
        <div>
          <div class="brand-name">LUMIÈRE</div>
          <div class="brand-subtitle">FINE DINING · ADMIN</div>
        </div>
      </div>

      <div class="login-copy">
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Admin Login</h1>
        <p>Manage your restaurant, menu, service and guest experience from one place.</p>
      </div>

      <form id="loginForm" class="login-form">
        <label for="email">EMAIL</label>
        <input id="email" type="email" value="admin@lumiere.com" autocomplete="username" required>

        <label for="password">PASSWORD</label>
        <div class="password-wrap">
          <input id="password" type="password" value="admin123" autocomplete="current-password" required>
          <button type="button" id="togglePassword" aria-label="Show password">SHOW</button>
        </div>

        <label class="remember-row">
          <input type="checkbox" id="rememberMe" checked>
          <span>Remember me</span>
        </label>

        <button class="gold-button full-width" type="submit">SIGN IN →</button>
        <p id="loginError" class="form-error"></p>
      </form>

      <div class="login-footer">
        <span>© 2026 Lumière</span>
        <span>Secure Admin Panel</span>
      </div>
    </div>
  </main>
  <script src="admin.js"></script>
</body>

</html>
